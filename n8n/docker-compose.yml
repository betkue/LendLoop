# LendLoop automations: n8n + Mailpit (local fake SMTP server with a web inbox).
#
#   cp n8n/.env.example n8n/.env     # then fill in the secrets (same values as in Convex)
#   docker compose -f n8n/docker-compose.yml up -d
#
# n8n:     http://localhost:5678   (workflows are imported on start)
# Mailpit: http://localhost:8025   (every email sent by n8n lands here)
# Both ports are bound to 127.0.0.1 only: nothing is exposed to the network.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file: .env
    environment:
      TZ: ${GENERIC_TIMEZONE:-UTC}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Code nodes verify HMAC signatures with Node's crypto module…
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # …and read the secrets and Convex URL from these environment variables.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      HMAC_SECRET_CONVEX_TO_N8N: ${HMAC_SECRET_CONVEX_TO_N8N}
      HMAC_SECRET_N8N_TO_CONVEX: ${HMAC_SECRET_N8N_TO_CONVEX}
      CONVEX_SITE_URL: ${CONVEX_SITE_URL:-http://host.docker.internal:3211}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    # Reach the local Convex backend running on the host machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    # Import (or update) the three LendLoop workflows, then start n8n.
    entrypoint: ["/bin/sh", "-c", "n8n import:workflow --separate --input=/workflows && exec n8n start"]
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # web inbox
      - "127.0.0.1:1025:1025"   # SMTP, used by n8n as host "mailpit", port 1025

volumes:
  n8n_data:
